name: resque
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  nearby_connections: ^4.1.3
  geolocator: ^13.0.1
  qr_flutter: ^4.1.0
  uuid: ^4.5.1
  connectivity_plus: ^6.1.0
  torch_light: ^1.1.0
  audioplayers: ^6.1.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.5

dependency_overrides:
  torch_light:
    path: packages/torch_light

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
